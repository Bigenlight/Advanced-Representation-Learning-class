<figure class="viz" id="viz-l07-dm">
  <div class="viz-head"><span class="viz-tag">인터랙티브</span><p class="viz-title">DivideMix co-divide: loss의 2-GMM으로 clean / noisy 나누기</p><span class="illus">illustrative</span></div>
  <div class="viz-scroll">
  <svg viewBox="0 0 660 270" role="img" aria-label="Histogram of synthetic per-sample loss with two-component GMM fit, clean probability curve, and threshold split">
    <g data-bg></g>
    <line class="ax" x1="50" y1="230" x2="640" y2="230"/><line class="ax" x1="50" y1="30" x2="50" y2="230"/>
    <g data-bars></g>
    <polyline class="ln-acc" stroke-width="2" data-g1 points=""/>
    <polyline class="ln-trap" stroke-width="2" data-g2 points=""/>
    <polyline class="ln-ink" stroke-width="2.5" data-w points=""/>
    <line class="ln-ink dash" stroke-width="1.5" data-cut x1="0" x2="0" y1="30" y2="230"/>
    <text class="t t-m mono" x="640" y="256" text-anchor="end">per-sample loss →</text>
    <text class="t t-m" x="46" y="34" text-anchor="end">#</text>
    <text class="t t-acc b" x="60" y="48" data-labX></text>
    <text class="t t-trap b" x="630" y="48" text-anchor="end" data-labU></text>
  </svg>
  </div>
  <style>
  #viz-l07-dm .lg{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.8rem;color:var(--muted)}
  #viz-l07-dm .lg i{display:inline-block;width:.85rem;height:.6rem;margin-right:.35rem;border-radius:2px;vertical-align:baseline}
  #viz-l07-dm .lg i.l{height:0;border-top:2.5px solid;width:1.2rem;border-radius:0}
  </style>
  <div class="lg">
    <span><i style="background:var(--accent)"></i>진짜 clean (합성)</span>
    <span><i style="background:var(--trap)"></i>진짜 noisy (합성)</span>
    <span><i class="l" style="border-color:var(--accent)"></i>GMM clean 성분</span>
    <span><i class="l" style="border-color:var(--trap)"></i>GMM noisy 성분</span>
    <span><i class="l" style="border-color:var(--ink)"></i>w = clean 확률 (0~1, 차트 높이에 맞춰 그림)</span>
  </div>
  <div class="viz-ctrl"><label for="viz-l07-dm-tau">clean probability threshold τ <input type="range" id="viz-l07-dm-tau" min="0.05" max="0.95" step="0.01" value="0.5"></label><output data-out>0.50</output><span data-cnt class="mono"></span></div>
  <figcaption>합성 loss 분포라 모양만 봐. clean 샘플은 loss가 낮고 noisy는 높아서 2-GMM이 두 덩어리로 갈라 줘. 샘플별 <code>w</code> = 낮은 loss 성분에 속할 확률이고, <code>w ≥ τ</code>면 labeled 𝒳, 아니면 <b>label만 버리고</b> unlabeled 𝒰로 MixMatch에 넣어. net A의 GMM 분할로 net B를 학습, 반대도 마찬가지 (co-divide, p.54 line 4–5). 단, 그림에서 w는 clean 성분 평균보다 loss가 낮은 구간을 1로 고정해서 그렸어. (L07 p.49–54)</figcaption>
  <script>
  (function(){
    var root=document.getElementById('viz-l07-dm'); if(!root) return;
    var seed=7; function rnd(){seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296;}
    function gauss(){var u=rnd()||1e-9,v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
    var D=[],i; for(i=0;i<240;i++) D.push([Math.min(Math.max(0.1,0.5+0.28*Math.abs(gauss())+0.12*gauss()),2.2),0]);
    for(i=0;i<80;i++) D.push([Math.min(Math.max(0.5,2.1+0.55*gauss()),3.9),1]);
    var xs=D.map(function(d){return d[0];}), n=xs.length;
    // EM for 2-comp 1D GMM
    var m=[0.5,2.0],s=[0.4,0.5],pi=[0.5,0.5],it,k,r;
    function pdf(x,k){return Math.exp(-0.5*Math.pow((x-m[k])/s[k],2))/(s[k]*2.5066);}
    for(it=0;it<60;it++){
      var R=xs.map(function(x){var a=pi[0]*pdf(x,0),b=pi[1]*pdf(x,1);return a/(a+b+1e-12);});
      for(k=0;k<2;k++){var sw=0,sx=0,sv=0;
        xs.forEach(function(x,j){var q=k===0?R[j]:1-R[j];sw+=q;sx+=q*x;});
        m[k]=sx/sw; xs.forEach(function(x,j){var q=k===0?R[j]:1-R[j];sv+=q*(x-m[k])*(x-m[k]);});
        s[k]=Math.max(Math.sqrt(sv/sw),0.05); pi[k]=sw/n;}
    }
    if(m[0]>m[1]){m.reverse();s.reverse();pi.reverse();}
    var X0=50,W=590,XM=4, NB=32, bw=XM/NB, YB=230, YH=180;
    function X(x){return X0+W*x/XM;}
    function w(x){if(x<m[0]) return 1; var a=pi[0]*pdf(x,0),b=pi[1]*pdf(x,1);return a/(a+b+1e-12);}
    var ns='http://www.w3.org/2000/svg';
    function el(t,a){var e=document.createElementNS(ns,t);for(var p in a)e.setAttribute(p,a[p]);return e;}
    var cnt=[],cn=[]; for(i=0;i<NB;i++){cnt.push(0);cn.push(0);}
    D.forEach(function(d){var b=Math.min(NB-1,Math.floor(d[0]/bw)); if(d[1]) cn[b]++; else cnt[b]++;});
    var mx=Math.max.apply(null,cnt.map(function(c,j){return c+cn[j];})), sc=YH/mx;
    var G=root.querySelector('[data-bars]');
    for(i=0;i<NB;i++){
      var h1=cnt[i]*sc,h2=cn[i]*sc,x=X(i*bw)+1,bwid=W*bw/XM-2;
      if(h1>0) G.appendChild(el('rect',{x:x,y:YB-h1,width:bwid,height:h1,class:'f-acc',style:'opacity:.75'}));
      if(h2>0) G.appendChild(el('rect',{x:x,y:YB-h1-h2,width:bwid,height:h2,class:'f-trap',style:'opacity:.75'}));
    }
    function curve(k){var p=[];for(var j=0;j<=118;j++){var x=XM*j/118;p.push(X(x).toFixed(1)+','+(YB-sc*n*bw*pi[k]*pdf(x,k)).toFixed(1));}return p.join(' ');}
    root.querySelector('[data-g1]').setAttribute('points',curve(0));
    root.querySelector('[data-g2]').setAttribute('points',curve(1));
    var wp=[];for(i=0;i<=118;i++){var xx=XM*i/118;wp.push(X(xx).toFixed(1)+','+(YB-YH*w(xx)).toFixed(1));}
    root.querySelector('[data-w]').setAttribute('points',wp.join(' '));
    var inp=root.querySelector('input'), out=root.querySelector('[data-out]'), cut=root.querySelector('[data-cut]'), bg=root.querySelector('[data-bg]');
    function draw(){
      var tau=parseFloat(inp.value); out.textContent=tau.toFixed(2);
      // loss cut where w(x)=tau (w decreasing in x)
      var lo=0,hi=XM; for(var j=0;j<40;j++){var mid=(lo+hi)/2; if(w(mid)>=tau) lo=mid; else hi=mid;}
      var c=lo, cx=X(c); cut.setAttribute('x1',cx);cut.setAttribute('x2',cx);
      bg.textContent='';
      bg.appendChild(el('rect',{x:X0,y:30,width:cx-X0,height:200,class:'f-accs'}));
      bg.appendChild(el('rect',{x:cx,y:30,width:X0+W-cx,height:200,class:'f-traps'}));
      var nx=0,nu=0,ok=0; D.forEach(function(d){ if(d[0]<=c){nx++; if(!d[1]) ok++;} else nu++; });
      root.querySelector('[data-labX]').textContent='labeled 𝒳 (w ≥ τ)';
      root.querySelector('[data-labU]').textContent='unlabeled 𝒰 (w < τ)';
      root.querySelector('[data-cnt]').textContent='|𝒳|='+nx+' (그중 진짜 clean '+ok+') · |𝒰|='+nu;
    }
    inp.addEventListener('input',draw); draw();
  })();
  </script>
</figure>
