  <div class="note next" style="margin:0"><span class="tag">Temporal Ensembling은 다른 EMA</span><p>같은 식 모양이지만 <b>weight가 아니라 sample별 prediction</b>의 EMA야 (<span class="math">Z ← αZ + (1−α)z</span>). 매 step이 아니라 <b>epoch 끝</b>에 갱신하고, 처음 epoch의 편향은 <span class="math">z̃ = Z/(1−α<sup>t</sup>)</span>로 보정해. 위 곡선은 weight EMA에 해당 (L06 p.20).</p></div>
  <figcaption>fast 쪽 값이 0 → 1로 바뀐 순간부터 slow 쪽(teacher)이 따라오는 곡선 <code>1 − m<sup>t</sup></code>. 63%에 닿는 데 걸리는 시간이 대략 <code>1/(1−m)</code> step이라, m이 1에 가까울수록 teacher는 느리고 안정적이야. Mean Teacher는 처음엔 β = 0.99로 빨리 따라가다 student가 수렴하면 β = 0.999로 teacher를 더 안정적으로 만들어 (L06 p.28). MoCo의 key encoder도 같은 weight EMA인데 m 값은 슬라이드에 안 나와서 표시 안 했어 (L05 p.12). 개념 그림.</figcaption>
