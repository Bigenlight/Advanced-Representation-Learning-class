  <figcaption>세로로 비교해 봐. <b>SimCLR</b>는 같은 encoder 두 번 + InfoNCE(batch 안 negative). <b>BYOL</b>은 online에만 <b>predictor</b>가 있고 target은 EMA + <b>sg</b>라 negative 없이도 collapse를 피해. <b>Barlow Twins</b>는 sample이 아니라 feature 차원끼리 D×D 상관행렬을 I로. <b>DINO</b>는 BYOL과 비슷하지만 MSE가 아니라 softmax 분포 간 CE이고, collapse는 teacher의 <b>centering + sharpening</b>(teacher에만, softmax는 양쪽)으로 막아. (L04 p.23–44)</figcaption>
</figure>
