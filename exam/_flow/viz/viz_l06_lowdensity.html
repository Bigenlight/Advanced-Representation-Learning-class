  <figcaption>두 boundary 모두 <b>labeled 점 4개는 다 맞혀</b> (label만 보면 구분 불가). 하지만 unlabeled까지 보면 아래쪽은 같은 cluster 안의 점들을 갈라서 H2(cluster)·H3(low-density)를 어겨. unlabeled의 역할 = 이런 boundary를 걸러내는 거야. (개념 그림, 점은 임의 생성, L06 p.11–14)</figcaption>
  <script>
  (function(){
    var root=document.getElementById('viz-l06-lds'); if(!root) return;
    var g=root.querySelector('[data-good]'), b=root.querySelector('[data-bad]'), bl=root.querySelector('[data-badleg]'), note=root.querySelector('[data-note]');
    var btns=root.querySelectorAll('button[data-b]'), NB=17;
    function draw(m){
      var bad=(m==='bad');
      g.setAttribute('display',bad?'none':''); b.setAttribute('display',bad?'':'none'); bl.setAttribute('display',bad?'':'none');
      for(var i=0;i<btns.length;i++) btns[i].setAttribute('aria-pressed',btns[i].getAttribute('data-b')===m?'true':'false');
      note.textContent=bad?('H3 위반: 점이 빽빽한 곳을 지나서 cluster A의 unlabeled '+NB+'개가 B쪽으로 넘어가. H2도 위반.'):'H3: 점이 드문 곳을 지나니까 각 cluster가 통째로 한 class가 돼. H2도 만족.';
    }
    for(var i=0;i<btns.length;i++) btns[i].addEventListener('click',function(){ draw(this.getAttribute('data-b')); });
    draw('good');
  })();
  </script>
