  <figcaption>두 view의 feature z₁, z₂는 같은 encoder와 같은 prototype C(accent 실선 = gradient로 학습)를 지나가. C로 <b>prediction p</b>와 <b>code q</b>를 얻고, loss는 <b>자기 view가 아니라 반대 view의 q</b>를 맞히는 CE야(crossed 화살표). 자기 code를 자기가 맞히면 trivial하니까 swap해서 view-invariant를 배우게 해. q는 C가 바로 주는 게 아니라 z·C 점수를 Sinkhorn으로 정리한 target이고, gradient가 안 간다는 건(sg*) 슬라이드가 아니라 노트의 보충 설명이야. 아래 줄처럼 SwAV는 feature끼리 비교하지 않고 prototype 배정을 예측해. (L05 p.26–30)</figcaption>
