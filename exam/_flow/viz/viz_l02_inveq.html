<figure class="viz" id="viz-l02-inveq">
  <div class="viz-head"><span class="viz-tag">구조 비교</span><p class="viz-title">Invariance vs Equivariance</p></div>
  <div class="viz-scroll">
  <svg viewBox="0 0 680 290" role="img" aria-label="Commutative diagrams for invariance and equivariance"><defs><marker id="viz-l02-inv-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:var(--ink)"/></marker></defs><text class="t b" x="160" y="24" text-anchor="middle" style="font-size:15px">Invariance</text><rect class="box-data" x="30" y="44" width="56" height="48"/><text class="t mono" x="58" y="74" text-anchor="middle">x</text><rect class="box-data" x="234" y="44" width="56" height="48"/><text class="t mono" x="262" y="74" text-anchor="middle">t(x)</text><line class="ln-ink" stroke-width="1.5" x1="90" y1="68" x2="230" y2="68" marker-end="url(#viz-l02-inv-ar)"/><text class="t mono" x="160" y="60" text-anchor="middle">t</text><line class="ln-acc" stroke-width="1.8" x1="58" y1="96" x2="58" y2="150" marker-end="url(#viz-l02-inv-ar)"/><text class="t t-acc mono b" x="68" y="128">f</text><line class="ln-acc" stroke-width="1.8" x1="262" y1="96" x2="262" y2="150" marker-end="url(#viz-l02-inv-ar)"/><text class="t t-acc mono b" x="272" y="128">f</text><rect class="box" x="20" y="156" width="280" height="76" rx="6" style="stroke:var(--line)"/><text class="t t-m mono" x="26" y="172" style="font-size:12px">feature space</text><circle cx="160" cy="208" r="8" class="f-acc"/><text class="t t-m mono" x="160" y="194" text-anchor="middle" style="font-size:12px">같은 점</text><text class="t mono b" x="160" y="262" text-anchor="middle" style="font-size:15px">f(t(x)) = f(x)</text><text class="t b" x="520" y="24" text-anchor="middle" style="font-size:15px">Equivariance</text><rect class="box-data" x="390" y="44" width="56" height="48"/><text class="t mono" x="418" y="74" text-anchor="middle">x</text><rect class="box-data" x="594" y="44" width="56" height="48"/><text class="t mono" x="622" y="74" text-anchor="middle">t(x)</text><line class="ln-ink" stroke-width="1.5" x1="450" y1="68" x2="590" y2="68" marker-end="url(#viz-l02-inv-ar)"/><text class="t mono" x="520" y="60" text-anchor="middle">t</text><line class="ln-acc" stroke-width="1.8" x1="418" y1="96" x2="418" y2="150" marker-end="url(#viz-l02-inv-ar)"/><text class="t t-acc mono b" x="428" y="128">f</text><line class="ln-acc" stroke-width="1.8" x1="622" y1="96" x2="622" y2="150" marker-end="url(#viz-l02-inv-ar)"/><text class="t t-acc mono b" x="632" y="128">f</text><rect class="box" x="380" y="156" width="280" height="76" rx="6" style="stroke:var(--line)"/><text class="t t-m mono" x="386" y="172" style="font-size:12px">feature space</text><circle cx="430" cy="208" r="8" class="f-acc"/><circle cx="610" cy="208" r="8" class="f-rl"/><line class="ln-rl" stroke-width="1.8" x1="442" y1="208" x2="596" y2="208" marker-end="url(#viz-l02-inv-ar)"/><text class="t t-rl mono b" x="520" y="198" text-anchor="middle">φ(t, ·)</text><text class="t mono" x="430" y="226" text-anchor="middle" style="font-size:12px">f(x)</text><text class="t mono" x="610" y="226" text-anchor="middle" style="font-size:12px">f(t(x))</text><text class="t mono b" x="520" y="262" text-anchor="middle" style="font-size:15px">f(t(x)) = φ(t, f(x))</text><line class="grid" x1="340" y1="10" x2="340" y2="275"/></svg></div>
  <figcaption>양쪽 모두 위의 가로 화살표가 입력에 변환 <code>t</code>를 거는 거고 (x → t(x)), 세로 화살표 <code>f</code>는 encoder로 feature를 뽑는 거야. <b>Invariance</b>(왼쪽)는 x와 t(x)의 feature가 <b>같은 점</b>이라 "무슨 변환을 했나"가 지워져. <b>Equivariance</b>(오른쪽)는 두 feature가 다른 점이지만, f(x)에서 <code>φ(t,·)</code> 화살표를 따라가면 f(t(x))에 닿아. 즉 입력이 변한 만큼 feature도 <b>예측 가능하게</b> 변하고, 변환 정보가 남아. contrastive는 augmentation에 invariant해지면서 변환 정보를 버려. invariance는 <code>φ = id</code>(아무것도 안 바꾸는 map)인 equivariance의 특수한 경우야. (L02 p.75)</figcaption>
</figure>
