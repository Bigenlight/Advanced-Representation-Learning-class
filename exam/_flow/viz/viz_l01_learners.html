<figure class="viz" id="viz-l01-learners">
  <style>
  #viz-l01-learners .lr{display:grid;grid-template-columns:minmax(7.5rem,10rem) 1fr;gap:.35rem .7rem;align-items:center}
  #viz-l01-learners .lr>*{padding:.45rem .6rem;border-radius:6px;min-width:0}
  #viz-l01-learners .n{font:600 .9rem/1.3 var(--f-mono);border:1px solid var(--line)}
  #viz-l01-learners .d{font-size:.9rem;line-height:1.4;color:var(--ink)}
  #viz-l01-learners .g{grid-column:1/-1;font:600 .72rem/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:.2rem .1rem;margin-top:.3rem}
  #viz-l01-learners .c{background:var(--accent-soft);border-color:var(--accent)}
  #viz-l01-learners .p{background:var(--rl-soft);border-color:var(--rl)}
  #viz-l01-learners .trap{background:var(--trap-soft);border-color:var(--trap)}
  #viz-l01-learners .tg{display:inline-block;font:600 .68rem/1 var(--f-mono);color:var(--trap);border:1px solid var(--trap);border-radius:999px;padding:.15rem .4rem;margin-left:.4rem;white-space:nowrap}
  </style>
  <div class="viz-head"><span class="viz-tag">개념 그림</span><p class="viz-title">Types of Representation Learners: 6개를 원리 2개로 나누기</p></div>
  <div class="lr">
    <div class="g" style="color:var(--accent)">Compression</div>
    <div class="n c">Autoencoding</div><div class="d">Remove redundant information</div>
    <div class="n trap">Contrastive</div><div class="d">Achieve invariance to viewing transformations<span class="tg">시험 함정</span></div>
    <div class="n c">Clustering</div><div class="d">Quantize continuous data into discrete categories</div>
    <div class="g" style="color:var(--rl)">Prediction</div>
    <div class="n p">Future prediction</div><div class="d">Predict the future</div>
    <div class="n p">Imputation</div><div class="d">Predict missing data</div>
    <div class="n p">Pretext tasks</div><div class="d">Predict abstract properties of your data</div>
  </div>
  <figcaption>p.23 표를 학습 원리별로 묶은 거야. 오른쪽 영어 문장은 슬라이드 원문 한 줄 요약이야. 위 세 개(<b>Compression</b>)는 쓸모없는 정보를 버리면서 배우고, 아래 세 개(<b>Prediction</b>)는 안 보이는 걸 맞히면서 배워. 헷갈리기 쉬운 건 <b>Contrastive = Compression</b>이야 (변형 때문에 생긴 차이를 nuisance로 보고 버리니까). (L01 p.21–23)</figcaption>
</figure>
