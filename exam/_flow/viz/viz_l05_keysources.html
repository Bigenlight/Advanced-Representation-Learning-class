  <figcaption>세 칸 모두 query는 학습되는 encoder <code>f_q</code>(파란 상자, 파란 선)로 만들어. 다른 건 <b>positive key k⁺와 negative가 어디서 오나</b>야. 초록 선 = key가 loss로 가는 길. <b>첫 칸 MoCo</b>: key encoder <code>f_k</code>는 회색 점선 상자 = gradient 없이 <code>f_q</code>의 EMA로만 갱신돼. 빗금과 <code>sg</code>(stop-gradient) 표시는 key 쪽으로 gradient가 안 간다는 뜻이야. 만든 key는 loss에 쓰이고, queue 오른쪽 끝(newest)으로 들어가서 왼쪽 끝(oldest)부터 빠져(FIFO). 그래서 negative가 많고(large) 서로 consistent해. <b>둘째 칸 End-to-end</b>: key도 지금 encoder로 계산하고 backprop해서 fresh하지만, negative가 같은 mini-batch뿐이라 batch 크기에 묶여. <b>셋째 칸 Memory bank</b>: 저장해 둔 값을 index로 꺼내 써서(encoder를 안 거침) negative가 많지만, 상자 색이 제각각인 것처럼 과거 여러 시점의 encoder가 쓴 값이라 stale해. (p.14 표 순서와 달리 MoCo를 맨 앞에 뒀고, End-to-end의 key encoder는 슬라이드 표기가 p.13/p.14에서 달라 "f_q와 같거나 별도"로 썼어.) (L05 p.11–14)</figcaption>
