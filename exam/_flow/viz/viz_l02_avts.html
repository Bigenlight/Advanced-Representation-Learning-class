  <figcaption>같은 영상 구간의 audio가 <b>positive</b>, 영상의 멀리 떨어진 구간 audio가 <b>hard</b>, 바로 인접(겹치는) 구간 audio가 <b>super hard</b> negative야. 너무 어려운 negative만 쓰면 학습이 꼬여서, <b>easy로 먼저 학습한 뒤 hard를 섞는 curriculum</b>이 가장 좋았어. easy = 다른 영상 audio는 논문 기준 설명. (L02 p.68–70)</figcaption>
