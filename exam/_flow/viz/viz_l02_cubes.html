  <figcaption>video를 가로 2 × 세로 2 × 시간 4 = 16칸으로 나눈 그림이야. 칸 하나가 cube(짧은 동영상 덩어리)고, 2×2 묶음 하나가 한 시간 구간이야. <b>Spatial</b>은 같은 시간 구간(time 3)의 네 위치에서, <b>Temporal</b>은 같은 위치(왼쪽 위)의 네 시간 구간에서 cube 4개를 뽑아 (번호 = 원래 순서). 이걸 섞고 원래 순서를 맞히니까 4! = 24가지 순열이 나와. 슬라이드는 여기에 "× 2 orientations"를 곱해 48 class라고 해 (= upside-down 여부, p.63. spatial/temporal을 곱한 게 아니야). 아래 p.62 그림의 입력이 이렇게 만들어져. 이미지 jigsaw는 공간만 보지만 video는 시간 순서·움직임까지 pretext에 들어와. 그림은 칸 구조를 개념적으로 그린 것. (L02 p.58–62)</figcaption>
