  <div class="viz-head"><span class="viz-tag">구조 비교</span><p class="viz-title">Π-model vs Temporal Ensembling vs Mean Teacher: target z̃는 어디서 오나</p></div>

ize:15px">MSE</text></g></g><line class="grid" x1="0" y1="200" x2="560" y2="200"/><g transform="translate(0,206)"><text class="t b" x="8" y="18" style="font-size:16px">Temporal Ensembling</text><text class="t t-m mono" x="8" y="40" style="font-size:14px">forward 1회 · Z ← αZ+(1−α)z , z̃ = Z/(1−α^t)</text><g transform="translate(0,34)"><rect class="box-data" x="8" y="68" width="38" height="36"/><text class="t mono" x="27" y="91" text-anchor="middle">x</text><path class="ln-ink" stroke-width="1.6" d="M46 86 L68 86" marker-end="url(#viz-l06-cmp-ah)"/><rect class="box-train" x="70" y="64" width="170" height="44" rx="6"/><text class="t mono" x="155" y="83" text-anchor="middle" style="font-size:14px">f_θ(g(x), t)</text><text class="t t-m" x="155" y="100" text-anchor="middle" style="font-size:14px">forward 1회</text><path class="ln-ink" stroke-width="1.6" d="M240 76 L388 76" marker-end="url(#viz-l06-cmp-ah)"/><text class="t mono" x="310" y="70">z</text><rect class="box-loss" x="390" y="66" width="90" height="40" rx="10"/><text class="t b" x="435" y="91" text-anchor="middle" style="font-size:15px">MSE</text><rect class="box-ema" x="290" y="116" width="140" height="40" rx="6"/><text class="t mono" x="360" y="133" text-anchor="middle">Z</text><text class="t t-m" x="360" y="150" text-anchor="middle" style="font-size:14px">N×C 메모리</text><path class="ln-m dash" stroke-width="1.6" d="M155 108 L155 136 L288 136" marker-end="url(#viz-l06-cmp-ah)"/><text class="t t-m" x="168" y="130" style="font-size:14px">EMA · epoch 끝</text><path class="ln-ink" stroke-width="1.6" d="M430 136 L460 136 L460 108" marker-end="url(#viz-l06-cmp-ah)"/><line class="ln-trap" stroke-width="2" x1="439" y1="143" x2="445" y2="129"/><line class="ln-trap" stroke-width="2" x1="447" y1="143" x2="453" y2="129"/><text class="t t-trap mono b" x="436" y="154">sg</text><text class="t mono" x="470" y="130">z̃</text></g></g><line class="grid" x1="0" y1="406" x2="560" y2="406"/><g transform="translate(0,412)"><text class="t b" x="8" y="18" style="font-size:16px">Mean Teacher</text><text class="t t-m mono" x="8" y="40" style="font-size:14px">forward 2회 · θ′ ← βθ′+(1−β)θ (매 iteration)</text><g transform="translate(0,34)"><rect class="box-data" x="8" y="68" width="38" height="36"/><text class="t mono" x="27" y="91" text-anchor="middle">x</text><path class="ln-ink" stroke-width="1.6" d="M46 86 L58 86 L58 52 L68 52" marker-end="url(#viz-l06-cmp-ah)"/><path class="ln-ink" stroke-width="1.6" d="M58 86 L58 122 L68 122" marker-end="url(#viz-l06-cmp-ah)"/><rect class="box-train" x="70" y="30" width="170" height="44" rx="6"/><text class="t mono" x="155" y="49" text-anchor="middle" style="font-size:14px">student f_θ</text><text class="t t-m" x="155" y="66" text-anchor="middle" style="font-size:14px">noise η · backprop</text><rect class="box-ema" x="70" y="100" width="170" height="44" rx="6"/><text class="t mono" x="155" y="119" text-anchor="middle" style="font-size:14px">teacher f_θ′</text><text class="t t-m" x="155" y="136" text-anchor="middle" style="font-size:14px">noise η′ · grad 없음</text><path class="ln-m dash" stroke-width="1.6" d="M155 74 L155 98" marker-end="url(#viz-l06-cmp-ah)"/><text class="t t-m" x="164" y="91" style="font-size:14px">EMA of weights</text><path class="ln-ink" stroke-width="1.6" d="M240 52 L320 52 L320 76 L388 76" marker-end="url(#viz-l06-cmp-ah)"/><path class="ln-ink" stroke-width="1.6" d="M240 122 L320 122 L320 98 L388 98" marker-end="url(#viz-l06-cmp-ah)"/><text class="t mono" x="270" y="44">z</text><text class="t mono" x="250" y="114">z̃</text><line class="ln-trap" stroke-width="2" x1="279" y1="129" x2="285" y2="115"/><line class="ln-trap" stroke-width="2" x1="287" y1="129" x2="293" y2="115"/><text class="t t-trap mono b" x="276" y="141">sg</text><rect class="box-loss" x="390" y="66" width="90" height="40" rx="10"/><text class="t b" x="435" y="91" text-anchor="middle" style="font-size:15px">MSE</text></g></g><g transform="translate(0,608)"><rect class="box-train" x="8" y="0" width="24" height="16" rx="3"/><text class="t t-m" x="40" y="13" style="font-size:14px">gradient로 학습</text><rect class="box-ema" x="170" y="0" width="24" height="16" rx="3"/><text class="t t-m" x="202" y="13" style="font-size:14px">EMA로만 갱신</text><rect class="box-loss" x="330" y="0" width="24" height="16" rx="5"/><text class="t t-m" x="362" y="13" style="font-size:14px">loss</text><line class="ln-trap" stroke-width="2" x1="8" y1="46" x2="14" y2="34"/><line class="ln-trap" stroke-width="2" x1="16" y1="46" x2="22" y2="34"/><text class="t t-m" x="32" y="45" style="font-size:14px">sg = stop-gradient</text></g></svg>
  <figcaption>세 방법 모두 loss는 <code>CE(labeled) + μ(t)·MSE(z, z̃)</code>야 (Π 코드에선 μ(t)를 w(t)라고 써). z는 지금 학습하는 모델의 출력이고, z̃는 "이거랑 같아져라"는 target이야. 세 방법은 <b>z̃의 출처</b> 하나만 달라. Π는 같은 네트워크(같은 θ)를 noise만 바꿔 한 번 더 forward해 (2회). TE는 forward 1회 + 샘플별 <b>prediction</b> 표 Z(N×C)를 epoch 끝에 EMA해 (슬라이드 caption: Z·z̃ 갱신은 minibatch 루프 안에서 해도 돼). MT는 <b>weight</b>를 매 iteration EMA한 teacher의 예측을 써. 실선 박스 = gradient로 학습, 점선 박스 = gradient 없이 EMA로만 갱신. <code>sg</code>(stop-gradient) 표시는 그쪽으로 gradient를 안 흘린다는 뜻이야. (L06 p.17–25)</figcaption>
