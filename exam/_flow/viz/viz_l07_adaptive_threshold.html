  <figcaption>① 위는 threshold 값(0~1)이 학습하면서 어떻게 변하는지, ② 아래는 그 threshold를 넘어 pseudo label로 쓰이는 unlabeled 샘플 비율(sampling rate)이야. 슬라이더로 학습 시점을 옮겨 봐. FixMatch는 τ가 처음부터 끝까지 0.95라서 학습 맨 처음(confidence가 낮을 때)엔 거의 다 버리고, 모델이 confident해지면서 통과 비율이 빠르게 올라와. FreeMatch는 <code>τ₀ = 1/C</code>(여기선 C = 10이라 0.1)에서 시작해 평균 confidence(점선)의 EMA를 따라 올라가. 그래서 처음부터 거의 다 통과시키고, τ<sub>t</sub>가 올라가 틀린 pseudo label을 거르는 후반에도 sampling rate가 <b>비교적 높게 유지돼</b> (p.74: remains relatively high). 즉 초반엔 양, 후반엔 질을 챙기면서 통과 비율을 크게 잃지 않아. (직관: 대부분 샘플의 confidence가 아주 높고 일부만 낮으면, 평균 confidence는 τ보다 낮아도 통과 비율은 높을 수 있어.) ② 곡선은 p.67 (d)·p.74 (b) 그래프의 대략적인 모양만 따라 그린 개념 그림이라 수치는 실제 값이 아냐. class별 보정(local threshold)은 생략. (L07 p.64–75)</figcaption>
  <script>
  (function(){
    var root=document.getElementById('viz-l07-thr'); if(!root) return;
    var N=100, C=10, X0=60, W=570;
    var conf=[],tau=[],pf=[],pr=[],i,v;
    // ① conf: 평균 confidence (개념), tau: 그 EMA (FreeMatch global threshold, p.69)
    for(i=0;i<=N;i++){ conf.push(0.1+0.78*(1-Math.exp(-i/5))); }
    v=1/C; for(i=0;i<=N;i++){ if(i>0) v=0.85*v+0.15*conf[i]; tau.push(v); }
    // ② sampling rate: p.67 (d), p.74 (b)의 정성적 모양 (FixMatch 0에서 빠르게 상승, FreeMatch ~1에서 시작해 높게 유지)
    for(i=0;i<=N;i++){ pf.push((0.70+0.14*i/N)*(1-Math.exp(-i/4))); pr.push(0.86+0.14*Math.exp(-i/5)+0.04*i/N); }
    function X(i){return X0+W*i/N;}
    function pts(a,y0,h){return a.map(function(y,i){return X(i).toFixed(1)+','+(y0-h*y).toFixed(1);}).join(' ');}
    function set(sel,p){root.querySelector(sel).setAttribute('points',p);}
    set('[data-conf]',pts(conf,216,180)); set('[data-free]',pts(tau,216,180));
    set('[data-fix]',pts(conf.map(function(){return 0.95;}),216,180));
    set('[data-pfix]',pts(pf,426,150)); set('[data-pfree]',pts(pr,426,150));
    var inp=root.querySelector('input'), out=root.querySelector('[data-out]'), cur=root.querySelectorAll('[data-cur]');
    function r5(x){return Math.round(100*x/5)*5;}
    function draw(){
      var k=parseInt(inp.value,10); out.textContent=k+'%';
      cur.forEach(function(c){c.setAttribute('x1',X(k));c.setAttribute('x2',X(k));});
      root.querySelector('[data-ro1]').textContent='FixMatch 통과 ≈ '+r5(pf[k])+'%';
      root.querySelector('[data-ro2]').textContent='FreeMatch 통과 ≈ '+r5(pr[k])+'%';
    }
    inp.addEventListener('input',draw); draw();
  })();
  </script>
